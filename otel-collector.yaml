receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4319
      http:
        endpoint: 127.0.0.1:4320

processors:
  batch:

exporters:
  debug:
    verbosity: normal
  file:
    path: ${OTEL_LOG_PATH}
  file/traces:
    path: ${OTEL_TRACES_PATH}
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug, file/traces]
