            - 荃优美香银占3号
            - Q两优银泰香占
            - 荃优美香丝苗1号
        missing_fields:
          - variety
        followup_count: 0
    region_followup_prompt:
      user_id: u1
      followup:
        prompt: '1'
        followup_count: 1
    fake_lookup:
      confirmed_candidate: 美香占2号
      records:
        - 品种名称: 美香占2号
          审定区域: 湖南
          审定年份: '2020'
        - 品种名称: 美香占2号
          审定区域: 芜湖
          审定年份: '2021'
      raw_records:
        - variety_name: 美香占2号
          approval_region: 湖南
        - variety_name: 美香占2号
          approval_region: 芜湖
      fallback_records:
        - 品种名称: 美香占2号
          审定区域: 湖南
          审定年份: '2020'
        - 品种名称: 美香占2号
          审定区域: 芜湖
          审定年份: '2021'
      fallback_raw_records:
