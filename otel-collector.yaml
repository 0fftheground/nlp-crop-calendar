receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:

exporters:
  debug:
    verbosity: normal
  file:
    path: ${OTEL_LOG_PATH}
  file/traces:
    path: ${OTEL_TRACES_PATH}
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki, file]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug, file/traces]
