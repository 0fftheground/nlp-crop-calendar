sowing_service_cases:
  - id: uses_region_id_and_variety_sub_type
    request_payload:
      variety: 美香占2号
      culti_type: 一季晚稻
      planting_method: 直播
      region_id: 长沙
    config:
      agri_db_url: postgresql://example
      business_api_key:
      business_api_base_url: http://example.test
      sowing_suitability_api_url:
      default_farm_id: "8"
      db_region_lookup_candidates: []
      region_db_table:
    sql:
      dict_rows:
        sowingmtd:
          - code: 0
            code_name: 直播
        culti_type:
          - code: 4
            code_name: 一季晚稻
        sub_type:
          - code: 9
            code_name: 籼稻
      sub_type_rows:
        - sub_type: 9
      region_rows:
        - region_id: 430100
          region_name: 长沙市
    http_response:
      code: 200
      message: success
      data:
        suitDate:
          - "2026-03-25"
          - "2026-03-26"
        unsuitDate:
          - ""
        unsuitReasons:
          - ""
    expected:
      message: success
      url: http://example.test/bozhong_syd
      payload:
        region_id: 430100
        culti_type: 4
        sowing_method: 0
        sub_type: 9
        crop: 0
      result_suit_dates:
        - "2026-03-25"
        - "2026-03-26"
      resolved:
        sub_type: 9

