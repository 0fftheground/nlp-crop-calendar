      workflow_name: crop_calendar_workflow
      workflow_result:
        message: ok
        data:
          planting:
            region_id: 长沙
            crop: 水稻
            variety: 美香占2号
            culti_type: 早稻
            planting_method: transplanting
            sowing_date: '2026-03-20'
            transplant_date: '2026-04-05'
          plant_season_id: 1
          resolved_region_id: '430100'
    followup_turn:
