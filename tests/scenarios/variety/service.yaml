          approval_region: 湖南
        - variety_name: 美香占2号
          approval_region: 芜湖
      bug_trigger_keyword: 荃优美香丝苗1号
      bug_trigger_records:
        - 品种名称: 荃优美香丝苗1号
          审定区域: 湖南
      bug_trigger_raw_records:
        - variety_name: 荃优美香丝苗1号
