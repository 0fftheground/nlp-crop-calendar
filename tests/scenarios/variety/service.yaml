feature_cases:
  - id: requires_exact_name
    prompt:
      prompt: 美香占
      planting:
        crop: 水稻
    lookup_records:
      records:
        - 品种名称: 美香占2号
          审定区域: 湖南
      raw_records:
        - variety_name: 美香占2号
          approval_region: 湖南
