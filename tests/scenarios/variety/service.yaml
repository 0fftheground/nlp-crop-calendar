    session_id: v1
    seed_turn:
      prompt: 查询美香占2号审定信息
      plan_input:
        query: 查询美香占2号审定信息
      tool_result:
        name: variety_lookup
        message: ok
        data:
          crop: 水稻
          variety: 美香占2号
          region_choice: 湖南
          selected:
            品种名称: 美香占2号
    followup_turn:
      prompt: 在芜湖呢
      tool_result:
        name: variety_lookup
        message: ok
