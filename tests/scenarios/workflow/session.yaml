      plan_input:
        query: 查询美香占2号的生育期
      tool_name: growth_stage_lookup
      tool_result:
        message: ok
        data:
          plan_id: '12'
          plan_filters:
            variety: 美香占2号
            region_id: 长沙
            planting_method: direct_seeding
            culti_type: 早稻
            sowing_date: '2026-03-20'
          planting:
            variety: 美香占2号
            region_id: 长沙
            planting_method: direct_seeding
            culti_type: 早稻
            sowing_date: '2026-03-20'
    followup_turn:
      prompt: 在芜湖呢
      tool_result:
        message: ok
        data:
          plan_id: '12'
